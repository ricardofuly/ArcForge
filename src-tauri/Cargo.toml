[package]
name = "unreal-launcher"
version = "0.1.2"
description = "Launcher para gerenciar instalações da Unreal Engine e projetos no Linux e Windows"
authors = ["Ricardo Fuly <89115052+ricardofuly@users.noreply.github.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
dirs = "5"
anyhow = "1"
thiserror = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "stream"] }
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = "0.3"
egs-api = "0.14"
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3

